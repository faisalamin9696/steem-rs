[package]
name = "steem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Umbrella crate for the Rust Steem SDK"
keywords = ["steem", "blockchain", "wallet"]
readme = "README.md"
homepage = "https://github.com/faisalamin9696/steem-rs"
documentation = "https://docs.rs/steem"

[features]
default = ["rpc"]
rpc = ["dep:steem-rpc"]

[dependencies]
steem-core = { path = "../steem-core", version = "0.1.0" }
steem-rpc = { path = "../steem-rpc", version = "0.1.0", optional = true }

[package]
name = "steem-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core Steem protocol types, wire codec, cryptography, transaction signing and memo encryption"
keywords = ["steem", "blockchain", "wallet", "secp256k1"]
categories = ["cryptography", "encoding"]
readme = "README.md"
homepage = "https://github.com/faisalamin9696/steem-rs"
documentation = "https://docs.rs/steem-core"

[dependencies]
aes = "0.8"
bs58 = "0.5"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
rand = "0.8"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["recovery"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
zeroize.workspace = true
